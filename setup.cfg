[metadata]
name = pipetrace
version = 0.1.0
author = Uttakaladeba Garnaik
author_email = uttakaladeba.codes@gmail.com
description = A lightweight pipeline debugger and automated story insight engine for Pandas
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/uttakaladebagarnaik/pipetrace
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pandas>=1.3.0
    rich>=12.0.0

[options.extras_require]
dev =
    pytest>=7.0.0
    build>=1.0.0
    twine>=4.0.0
